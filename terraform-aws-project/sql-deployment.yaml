apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql
  template:
    metadata:
      labels:
        app: sql
    spec:
      containers:
      - name: sql
        image: flappimen/sql:latest
        ports:
        - containerPort: 1433

